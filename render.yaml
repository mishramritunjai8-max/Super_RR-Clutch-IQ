services:
  # Backend API Web Service
  - type: web
    name: superrr-clutch-iq-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production

  # Frontend React / Vite Static Site
  - type: web
    name: superrr-clutch-iq-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
